[package]
name = "wordcount"
version = "0.3.1"
edition = "2021"
authors = ["Demo <demo@example.com>"]
description = "统计单词频率的命令行工具"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "count"
harness = false
