<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一览 · 在线预览任何文件</title>
  <meta name="description" content="一览：在浏览器里直接预览 PDF、EPUB、Word、Excel、PPT、Markdown、代码、图片、音视频等文件。支持拖入文件夹和 zip，文件只在本机处理，不会上传。" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link id="hl-light" rel="stylesheet" href="./vendor/hljs/styles/github.min.css" />
  <link id="hl-dark" rel="stylesheet" href="./vendor/hljs/styles/github-dark.min.css" disabled />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./vendor/hljs/highlight.min.js"></script>
  <script src="./vendor/marked/marked.umd.js"></script>
  <script src="./vendor/dompurify/purify.min.js"></script>
  <script src="./vendor/jszip/jszip.min.js"></script>
</head>
<body>
<div id="app" class="app">
  <!-- 侧边栏：文件列表 -->
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <a class="brand" href="#/" data-home title="回到首页" aria-label="一览 · 回到首页">
        <img src="./favicon.svg" width="45" height="30" alt="一览" />
      </a>
      <div class="side-actions">
        <button id="btn-open" class="icon-btn" type="button" title="打开文件（⌘O）">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v12M4 10h12"/></svg>
        </button>
        <button id="btn-open-dir" class="icon-btn" type="button" title="打开文件夹">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 5.5a1 1 0 0 1 1-1h4l1.5 2h7.5a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/></svg>
        </button>
        <button id="btn-new" class="icon-btn" type="button" title="粘贴文本（⌘⇧V 或直接 ⌘V）">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="3.5" width="10" height="13" rx="1.5"/><path d="M8 3.5V2.5h4v1M7.5 8h5M7.5 11h5M7.5 14h3"/></svg>
        </button>
        <button id="btn-clear" class="icon-btn" type="button" title="清空我的文件">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h12M8 6V4h4v2M6 6l.7 10h6.6L14 6"/></svg>
        </button>
      </div>
    </div>
    <div class="side-filter">
      <input id="filter" type="search" placeholder="筛选文件名" autocomplete="off" spellcheck="false" />
    </div>
    <nav id="tree" class="tree" aria-label="文件列表"></nav>
    <div id="side-empty" class="side-empty">还没有文件</div>
    <div class="side-resizer" id="side-resizer" title="拖动调整宽度"></div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <header class="toolbar">
      <button id="btn-toggle-side" class="icon-btn" type="button" title="显示/隐藏侧边栏（⌘B）">
        <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M7.5 3.5v13"/></svg>
      </button>
      <a class="brand brand-mini" href="#/" data-home title="回到首页">
        <img src="./favicon.svg" width="36" height="24" alt="一览" />
      </a>
      <div class="file-info">
        <div id="file-name" class="file-name"></div>
        <div id="file-meta" class="file-meta"></div>
      </div>

      <div class="tool-group" id="file-tools" hidden>
        <div id="mode-seg" class="seg" role="tablist" hidden>
          <button type="button" data-mode="preview">预览</button>
          <button type="button" data-mode="code">源码</button>
        </div>
        <select id="lang-select" class="select" title="语言"></select>
        <select id="enc-select" class="select" title="文本编码">
          <option value="auto">自动编码</option>
          <option value="utf-8">UTF-8</option>
          <option value="gb18030">GBK / GB18030</option>
          <option value="big5">Big5</option>
          <option value="shift_jis">Shift_JIS</option>
          <option value="euc-kr">EUC-KR</option>
          <option value="utf-16le">UTF-16 LE</option>
          <option value="utf-16be">UTF-16 BE</option>
          <option value="windows-1252">Latin-1</option>
        </select>
        <span class="tool-sep"></span>
        <button id="btn-wrap" class="icon-btn toggle" type="button" title="自动换行（⌥Z）">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h14M3 10h11a2.5 2.5 0 0 1 0 5h-3m0 0 2-2m-2 2 2 2M3 15h4"/></svg>
        </button>
        <button id="btn-search" class="icon-btn" type="button" title="查找（⌘F）">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.2"/><path d="m12.4 12.4 4.3 4.3"/></svg>
        </button>
        <button id="btn-copy" class="icon-btn" type="button" title="拷贝全部内容">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6.5" y="6.5" width="10" height="10" rx="1.5"/><path d="M13.5 6.5V4.5a1 1 0 0 0-1-1h-8a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h2"/></svg>
        </button>
        <button id="btn-download" class="icon-btn" type="button" title="下载">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16.5h12"/></svg>
        </button>
      </div>

      <div class="tool-group">
        <button id="btn-font-down" class="icon-btn text-btn" type="button" title="缩小（⌘−）">A−</button>
        <button id="btn-font-up" class="icon-btn text-btn" type="button" title="放大（⌘+）">A+</button>
        <button id="btn-theme" class="icon-btn" type="button" title="切换主题">
          <svg class="i-sun" viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5z"/></svg>
          <svg class="i-auto" viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5v13A6.5 6.5 0 0 0 10 3.5z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <!-- 查找栏 -->
    <div id="findbar" class="findbar" hidden>
      <input id="find-input" type="search" placeholder="查找" autocomplete="off" spellcheck="false" />
      <button id="find-case" class="find-opt" type="button" title="区分大小写">Aa</button>
      <button id="find-regex" class="find-opt" type="button" title="正则表达式">.*</button>
      <span id="find-count" class="find-count"></span>
      <button id="find-prev" class="icon-btn" type="button" title="上一个（⇧Enter）">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5-5 5 5"/></svg>
      </button>
      <button id="find-next" class="icon-btn" type="button" title="下一个（Enter）">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7.5 5 5 5-5"/></svg>
      </button>
      <button id="find-close" class="icon-btn" type="button" title="关闭（Esc）">×</button>
    </div>

    <!-- 内容 -->
    <section id="viewer" class="viewer" tabindex="-1">
      <div id="welcome" class="welcome">
        <div class="welcome-card">
          <img class="welcome-logo" src="./favicon.svg" width="132" height="88" alt="一览" />
          <h1 class="sr-only">一览</h1>
          <p class="welcome-lead">在浏览器里直接打开任何文件，一眼看清内容。</p>
          <p>拖入文件、文件夹或 zip 压缩包，或者直接 <kbd>⌘V</kbd> 粘贴。</p>
          <div class="welcome-actions">
            <button class="btn btn-primary" type="button" data-trigger="open">打开文件</button>
            <button class="btn" type="button" data-trigger="open-dir">打开文件夹</button>
            <button class="btn" type="button" data-trigger="paste">粘贴文本</button>
            <button class="btn" type="button" data-trigger="examples">查看示例</button>
          </div>
          <ul class="formats">
            <li><b>文档</b>PDF · EPUB · Word · Excel / Numbers · PPT</li>
            <li><b>代码</b>80 多种语言语法高亮，JSON 树形浏览</li>
            <li><b>文本</b>Markdown · CSV / TSV · 日志 · 字幕 · 任意编码</li>
            <li><b>媒体</b>图片 · SVG · 音频 · 视频 · 字体</li>
          </ul>
          <p class="welcome-sub">文件只在本机浏览器中处理，不会上传到任何服务器。</p>
        </div>
      </div>
      <div id="content" class="content" hidden></div>
    </section>

    <footer class="statusbar">
      <span id="st-left"></span>
      <span id="st-right"></span>
    </footer>
  </main>
</div>

<!-- 粘贴文本对话框 -->
<div id="paste-mask" class="mask" hidden></div>
<div id="paste-dialog" class="dialog" role="dialog" aria-label="粘贴文本" hidden>
  <div class="dialog-head">
    <input id="paste-name" class="paste-name" type="text" placeholder="文件名（可选，用于识别语言，如 main.py）" spellcheck="false" />
  </div>
  <textarea id="paste-text" spellcheck="false" placeholder="在这里粘贴代码或文本…"></textarea>
  <div class="dialog-actions">
    <button class="btn" type="button" data-paste="cancel">取消</button>
    <button class="btn btn-primary" type="button" data-paste="ok">预览</button>
  </div>
</div>

<div id="drop-overlay" class="drop-overlay" hidden><div>松开以打开</div></div>
<div id="toast" class="toast" hidden></div>

<input id="file-input" type="file" multiple hidden />
<input id="dir-input" type="file" webkitdirectory multiple hidden />

<script type="module" src="./app.js"></script>
</body>
</html>
